project_overview:
  description: |
    Oyente+ is a modernized fork of the original Oyente smart contract analysis tool 
    that performs symbolic execution to detect security vulnerabilities in Ethereum smart contracts.

  current_state:
    - "✅ COMPLETED: Comprehensive test infrastructure (494 tests, 429 executed, 100% pass rate)"
    - "✅ COMPLETED: Code quality tooling configured (Black, Ruff, mypy)"
    - "✅ COMPLETED: 0 linting errors (massive improvement from 483)"
    - "✅ COMPLETED: Type hints for 15/17 modules with comprehensive docstrings"
    - "✅ COMPLETED: Complete type safety - 0 mypy errors (reduced from 172)"
    - "✅ MAJOR PROGRESS: 5 of 6 critical bugs FIXED ✅, tool reliability significantly improved"
    - "🔄 REMAINING: 1 critical bug (Source Map KeyError), CI/CD not configured"

# =============================================================================
# CURRENT STATUS & IMMEDIATE PRIORITIES
# =============================================================================

current_phase:
  title: "Critical Bug Resolution"
  status: "MAJOR PROGRESS - 5 of 6 critical bugs FIXED ✅"
  timeline: "1 day remaining for final critical bug"
  completed_fixes:
    file_path_resolution:
      - "✅ FIXED: File Path Resolution Bug in CODESIZE/CODECOPY opcodes"
      - "Location: oyente/symExec.py:1682, 1714"
      - "Solution: New resolve_evm_bytecode_file() helper function"

    stack_underflow:
      - "✅ FIXED: Stack Underflow Bug in SELFDESTRUCT opcode"
      - "Location: oyente/symExec.py:2363"
      - "Solution: Added proper stack validation with consistent error handling"

    z3_expression_exception:
      - "✅ FIXED: Z3 Expression Exception in SLOAD opcode"
      - "Location: oyente/symExec.py:1996-2021"
      - "Issue: Z3Exception when converting complex expressions to strings for variable naming"
      - "Solution: Safe string conversion with try-catch and hash-based fallback for complex Z3 expressions"
    log_opcodes_stack_validation:
      - "✅ FIXED: LOG0-LOG4 Opcodes Stack Validation Bug"
      - "Location: oyente/symExec.py:2199-2209"
      - "Issue: LOG opcodes were missing stack validation, causing crashes"
      - "Solution: Added proper stack size validation before popping elements"
      - "Tests: Added comprehensive unit tests in test_symexec.py"
    jump_address_conversion:
      - "✅ FIXED: JUMP/JUMPI Target Address Conversion Bug"
      - "Location: oyente/symExec.py:2054-2062, 2070-2079"
      - "Issue: JUMP/JUMPI opcodes failed when Z3 expressions produced decimal target addresses"
      - "Solution: Enhanced numeric conversion to handle decimals via float() before int()"
      - "Impact: Prevents crashes during symbolic execution with decimal addresses"
  remaining_critical_bugs:
    source_map_keyerror:
      - "✅ REPRODUCED: Successfully reproduced using BonusRewards.sol from skelcodes dataset"
      - "Location: oyente/vulnerability.py:124 (TypeError: 'NoneType' object is not subscriptable)"
      - "Root cause: source_map.py:231-238 returns {'begin': None} but vulnerability.py expects nested dict"
      - "Triggered by: Large contracts (>24KB) where PC positions cannot be mapped to source"
      - "Workaround: Use -j flag for JSON output to bypass human-readable warning generation"
      - "Issue: Manifests as TypeError rather than KeyError in vulnerability warning generation"
      - "Impact: Prevents human-readable vulnerability reports for affected contracts"

    json_parsing_error:
      - "Location: oyente/source_map.py:195"
      - "Issue: json.loads() called on empty string from compiler output"
      - "Triggered by: Old Solidity contracts (Wolker.sol, testingToken.sol, euroteambet.sol)"
      - "Error: json.decoder.JSONDecodeError: Expecting value: line 1 column 1 (char 0)"

