            - "Analysis execution time per contract"
            - "Memory usage peaks and averages"
            - "Z3 solver call statistics"
            - "Cache hit/miss ratios"
          
          reliability:
            - "Error rates by error type"
            - "Success/failure rates"
            - "Resource exhaustion incidents"
          
          usage:
            - "Contracts analyzed per day/hour"
            - "Vulnerability detection rates"
            - "Most common vulnerability types"

  # Priority 2.3: Security Hardening
  security_hardening:
    title: "Security Vulnerability Remediation"
    priority: "P1 - High" 
    estimated_effort: "1 week"
    
    requirements:
      command_injection_fixes:
        description: "Fix command injection vulnerabilities"
        current_issues:
          - "Direct shell command execution in utils.py"
          - "Unsafe subprocess calls"
          - "Insufficient input validation"
        
        fixes:
          safe_subprocess_calls:
            - "Use subprocess with shell=False"
            - "Parameterized command execution"
            - "Input sanitization and validation"
          
          example_fix: |
            ```python
            # BEFORE (vulnerable)
            cmd = f"evm --version"
            out = run_command(cmd).strip()
            
            # AFTER (secure)
            try:
                result = subprocess.run(
                    ["evm", "--version"],
                    capture_output=True,
                    text=True,
                    timeout=30,
                    shell=False
                )
                out = result.stdout.strip()
            except subprocess.TimeoutExpired:
                raise DependencyError("EVM command timed out")
            except FileNotFoundError:
                raise DependencyError("EVM not found in PATH")
            ```
      
      input_validation:
        description: "Comprehensive input validation"
        validation_points:
          - "File path validation to prevent path traversal"
          - "Bytecode format validation"
          - "Source code size limits"
          - "Configuration parameter validation"
        
        validation_framework: |
          ```python
          from pydantic import BaseModel, validator, Field
          
          class AnalysisRequest(BaseModel):
              source_code: str = Field(..., max_length=1_000_000)
              bytecode: Optional[str] = Field(None, regex=r"^[0-9a-fA-F]+$")
              timeout: int = Field(30, ge=1, le=3600)
              
              @validator('source_code')
              def validate_source_code(cls, v):
                  if len(v.strip()) == 0:
                      raise ValueError("Source code cannot be empty")
                  return v
          ```
      
      dependency_security:
        description: "Secure dependency management"
        requirements:
