  version: "2.0.0"
  maintainer: "Thomas Fenninger"
  repository: "https://github.com/smartbugs/oyente_plus"
  license: "GPL v3"

project_overview:
  description: |
    Oyente+ is a modernized fork of the original Oyente smart contract analysis tool
    that performs symbolic execution to detect security vulnerabilities in Ethereum smart contracts.

  current_state:
    - "✅ MAJOR PROGRESS: 5 of 6 critical bugs FIXED ✅, tool reliability significantly improved"
    - "✅ INFRASTRUCTURE: Pre-commit hooks and CI/CD pipeline configured"
    - "🔄 REMAINING: Final stability improvements and optimizations"

# =============================================================================
# CURRENT STATUS & IMMEDIATE PRIORITIES
# =============================================================================

current_phase:
  title: "Infrastructure Completion"
  status: "INFRASTRUCTURE COMPLETE - CI/CD and testing operational ✅"
  timeline: "Ready for next development phase"

  remaining_critical_bugs:
    source_map_keyerror:
      - "✅ REPRODUCED: Successfully reproduced using BonusRewards.sol from skelcodes dataset"
      - "Location: oyente/vulnerability.py:124 (TypeError: 'NoneType' object is not subscriptable)"
      - "Root cause: source_map.py:231-238 returns {'begin': None} but vulnerability.py expects nested dict"
      - "Triggered by: Large contracts (>24KB) where PC positions cannot be mapped to source"
      - "Workaround: Use -j flag for JSON output to bypass human-readable warning generation"
      - "Issue: Manifests as TypeError rather than KeyError in vulnerability warning generation"
      - "Impact: Prevents human-readable vulnerability reports for affected contracts"

    json_parsing_error:
      - "Location: oyente/source_map.py:195"
      - "Issue: json.loads() called on empty string from compiler output"
      - "Triggered by: Old Solidity contracts (Wolker.sol, testingToken.sol, euroteambet.sol)"
      - "Error: json.decoder.JSONDecodeError: Expecting value: line 1 column 1 (char 0)"

