        github_actions_workflow: |
          ```yaml
          name: CI/CD Pipeline
          
          on: [push, pull_request]
          
          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v3
                - name: Set up Python
                  uses: actions/setup-python@v4
                  with:
                    python-version: '3.8'
                - name: Install dependencies
                  run: |
                    pip install poetry
                    poetry install
                - name: Code formatting
                  run: poetry run black --check oyente/
                - name: Linting
                  run: poetry run ruff check oyente/
                - name: Type checking
                  run: poetry run mypy oyente/
                - name: Security scan
                  run: poetry run bandit -r oyente/
            
            test:
              runs-on: ubuntu-latest
              strategy:
                matrix:
                  python-version: ['3.8', '3.9', '3.10', '3.11']
              steps:
                - uses: actions/checkout@v3
                - name: Set up Python ${{ matrix.python-version }}
                  uses: actions/setup-python@v4
                  with:
                    python-version: ${{ matrix.python-version }}
                - name: Run tests
                  run: |
                    poetry install
                    poetry run pytest --cov=oyente --cov-report=xml
                - name: Upload coverage
                  uses: codecov/codecov-action@v3
          ```
      
