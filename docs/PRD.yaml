# Oyente+ Product Requirements Document (PRD)
# Version: 2.2
# Last Updated: 2025-08-06

metadata:
  project_name: "Oyente+"
  version: "2.0.0"
  maintainer: "Thomas Fenninger"
  repository: "https://github.com/smartbugs/oyente_plus"
  license: "GPL v3"
  
project_overview:
  description: |
    Oyente+ is a modernized fork of the original Oyente smart contract analysis tool 
    that performs symbolic execution to detect security vulnerabilities in Ethereum smart contracts.
    This PRD outlines the roadmap for transforming the current research prototype into a 
    production-ready, maintainable, and extensible security analysis platform.
  
  current_state:
    - Research prototype with sophisticated symbolic execution capabilities  
    - Updated for Python 3, latest Solidity versions, and new EVM opcodes
    - ✅ COMPLETED: Comprehensive test infrastructure (406+ tests, 99.8% pass rate)
    - ✅ COMPLETED: Code quality tooling configured (Black, Ruff, mypy)
    - ✅ COMPLETED: 100% test coverage for 9 core modules with advanced testing features
    - ✅ COMPLETED: symExec.py code quality transformation (0 Ruff errors, 72% MyPy improvement)
    - ✅ COMPLETED: Type hints and docstrings for core modules
    - ❌ CRITICAL ISSUES: 16 known bugs identified (5 critical, 8 medium, 3 low)
    - ❌ TESTING GAPS: 5 key modules lack test files
    - ❌ SOURCE MAP BUG: Tool effectively broken for Solidity source analysis
    - ❌ STACK UNDERFLOW: Systematic vulnerability in opcode handlers
  
  vision: |
    Transform Oyente+ into a best-in-class smart contract security analysis tool with:
    - Modern Python development practices
    - Comprehensive test coverage
    - Modular, extensible architecture
    - Production-ready code quality
    - Extensive developer tooling

