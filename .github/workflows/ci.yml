name: CI/CD Pipeline

on:
  push:
    branches: [main, master, ghwf-test]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  POETRY_VERSION: "2.4.3"

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: ./scripts/setup-venv.sh

      - name: Run code quality checks
        run: |
          make format-check
          make lint
          make type-check

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    needs: code-quality
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: ./scripts/setup-venv.sh

      - name: Run unit tests
        run: make test-unit

      - name: Generate coverage report
        if: matrix.python-version == '3.12'
        run: |
          make test-unit-cov
          if [ ! -f coverage.xml ] && [ -f coverage-unit.xml ]; then
            cp coverage-unit.xml coverage.xml
          fi

  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    needs: unit-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: ./scripts/setup-venv.sh

      - name: Install Solidity compiler
        run: |
          .poetry-venv/bin/poetry run solc-select install 0.8.19
          .poetry-venv/bin/poetry run solc-select use 0.8.19
          .poetry-venv/bin/poetry run solc --version

      - name: Run integration tests
        run: make test-integration

      - name: Test sample contract analysis
        run: |
          if [ -f samples/OpenAddressLottery.rt.hex ]; then
            .poetry-venv/bin/poetry run python oyente/oyente.py \
              -s samples/OpenAddressLottery.rt.hex -b
          else
            echo "Sample contract not found; skipping manual verification"
          fi
